# ──────────────────────────────────────────────
# Marinara Engine — Docker Compose
# ──────────────────────────────────────────────
services:
  marinara:
    # Use the pre-built image from GHCR
    image: ghcr.io/pasta-devs/marinara-engine:latest
    init: true
    ports:
      - "127.0.0.1:${PORT:-7860}:7860"
    volumes:
      - marinara-data:/app/data
    environment:
      - NODE_ENV=production
      - DATA_DIR=/app/data
      - FILE_STORAGE_DIR=/app/data/storage
      - MARINARA_DOCKER=true
      - AUTO_CREATE_DEFAULT_CONNECTION=${AUTO_CREATE_DEFAULT_CONNECTION:-true}
      - TRUSTED_HOSTS=${TRUSTED_HOSTS:-}
      - CORS_ORIGINS=${CORS_ORIGINS:-}
      - CSRF_TRUSTED_ORIGINS=${CSRF_TRUSTED_ORIGINS:-}
      # Set BASIC_AUTH_USER/BASIC_AUTH_PASS and ADMIN_SECRET before exposing beyond localhost.
      # - TZ=America/New_York          # IANA timezone for time-based features (e.g. character schedules)
      # - ENCRYPTION_KEY=              # AES key for API key encryption (generate: openssl rand -hex 32)
      # - LOG_LEVEL=debug              # Set to "debug" to log full prompts & responses
    restart: unless-stopped

  marinara-dev:
    build: .
    ports:
      - "${PORT:-7861}:7860"
    labels:
      # Reverse-proxied by caddy-docker-proxy via the host gateway (published
      # host port 7861).
      caddy_0: me-marinara-dev-1.lan.wildani.xyz
      caddy_0.reverse_proxy: host.docker.internal:7861
      caddy_1: http://me-marinara-dev-1.local https://me-marinara-dev-1.local
      caddy_1.tls: internal
      caddy_1.reverse_proxy: host.docker.internal:7861
    volumes:
      - marinara-data:/app/data
    environment:
      - NODE_ENV=production
      - DATA_DIR=/app/data
      - FILE_STORAGE_DIR=/app/data/storage
      - MARINARA_DOCKER=true
      - AUTO_CREATE_DEFAULT_CONNECTION=${AUTO_CREATE_DEFAULT_CONNECTION:-true}
      - ALLOW_UNAUTHENTICATED_PRIVATE_NETWORK=true
      - CORS_ORIGINS=*
      - CSRF_TRUSTED_ORIGINS=${CSRF_TRUSTED_ORIGINS:-}
      - ALLOW_UNAUTHENTICATED_REMOTE=true
      - UPDATES_ALLOW_REMOTE_APPLY=true
      - PROVIDER_LOCAL_URLS_ENABLED=true
      - IMAGE_LOCAL_URLS_ENABLED=true
      - TTS_LOCAL_URLS_ENABLED=true
      - DEEPLX_LOCAL_URLS_ENABLED=true
      - WEBHOOK_LOCAL_URLS_ENABLED=true
      - HAPTICS_ALLOW_REMOTE=true
      - ADMIN_SECRET=${ADMIN_SECRET}
      # Set BASIC_AUTH_USER/BASIC_AUTH_PASS and ADMIN_SECRET before exposing beyond localhost.
      # - TZ=America/New_York          # IANA timezone for time-based features (e.g. character schedules)
      # - ENCRYPTION_KEY=              # AES key for API key encryption (generate: openssl rand -hex 32)
      - LOG_LEVEL=debug              # Set to "debug" to log full prompts & responses
    restart: unless-stopped

volumes:
  marinara-data:
